{% extends "core/base.html" %}

{% block content %}

<h2>Create Daily Log</h2>

{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Submit Log
    </button>

</form>

{% endblock %}
