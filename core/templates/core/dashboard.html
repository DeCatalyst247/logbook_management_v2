{% extends 'core/base.html' %}

{% block content %}

<div class="container mt-5">

<h2 class="mb-4">

Student Dashboard

</h2>

<div class="row">

<div class="col-md-3">

<div class="card text-center shadow">

<div class="card-body">

<h1 class="text-primary">

{{ total_logs }}

</h1>

<h5>Total Logs</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center shadow">

<div class="card-body">

<h1 class="text-success">

{{ approved_logs }}

</h1>

<h5>Approved</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center shadow">

<div class="card-body">

<h1 class="text-warning">

{{ pending_logs }}

</h1>

<h5>Pending</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center shadow">

<div class="card-body">

<h1 class="text-danger">

{{ rejected_logs }}

</h1>

<h5>Rejected</h5>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
